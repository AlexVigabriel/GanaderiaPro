services:
  db:
    image: postgres:16
    container_name: ganaderiapro-db
    environment:
      POSTGRES_DB: ganaderiapro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ganaderiapro-db-data:/var/lib/postgresql/data

volumes:
  ganaderiapro-db-data:
